<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoramento de Pagamentos – PCF/EPCF</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-int">
      <a class="marca" href="#/painel">
        <span class="marca-sigla">PCF</span>
        <span class="marca-txt"><b id="tituloSistema">Monitoramento de Pagamentos</b><small id="subtituloSistema">Consulta por estado e município</small></span>
      </a>
      <div class="busca-rapida">
        <input id="buscaRapida" type="search" placeholder="Buscar município ou código IBGE…" autocomplete="off" aria-label="Buscar município">
        <ul id="sugestoes" class="sugestoes" hidden></ul>
      </div>
      <label class="sel-mes">Mês de referência
        <select id="selMes"></select>
      </label>
    </div>
    <nav class="menu" id="menu">
      <a href="#/painel" data-rota="painel">Painel nacional</a>
      <a href="#/busca" data-rota="busca">Busca avançada</a>
      <a href="#/uf" data-rota="uf">Estados</a>
      <a href="#/atualizar" data-rota="atualizar" style="display:none">Atualizar dados</a>
      <a href="#/ajuda" data-rota="ajuda" style="display:none">Como usar</a>
    </nav>
  </header>

  <div id="avisoBase" class="aviso-base" hidden></div>

  <div class="so-impressao cab-impressao">
    <b>Monitoramento de Pagamentos – PCF/EPCF</b>
    <span id="rodapeImpressao"></span>
  </div>

  <main id="conteudo" class="conteudo">
    <p class="carregando">Carregando dados…</p>
  </main>

  <footer class="rodape">
    <span id="infoBase"></span>
  </footer>

  <!-- Bibliotecas locais (funcionam sem internet) -->
  <script src="lib/chart.umd.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <!-- Base oficial publicada na pasta -->
  <script src="dados/dados.js"></script>
  <!-- Sistema -->
  <script src="js/config.js"></script>
  <script src="js/conversor.js"></script>
  <script src="js/armazenamento.js"></script>
  <script src="js/base.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/paginas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
